# Al subir una etiqueta de versión (por ejemplo v2.0.0):
#   1. corre los tests y compila IngresosApp.exe (Windows) e IngresosApp (Linux);
#   2. calcula la huella SHA-256 de cada archivo y deja constancia pública de que
#      se compilaron aquí, desde este código (attestation de GitHub);
#   3. crea la release como BORRADOR con las notas del CHANGELOG.
# Se revisa el borrador en GitHub y se publica a mano.
name: Publicar versión

on:
  push:
    tags: ["v*"]

jobs:
  compilar:
    strategy:
      matrix:
        include:
          - sistema: windows-latest
            archivo: IngresosApp.exe
          - sistema: ubuntu-22.04  # glibc más antigua: el ejecutable funciona en más distribuciones
            archivo: IngresosApp
    runs-on: ${{ matrix.sistema }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt pyinstaller
      - name: La etiqueta coincide con la versión del código
        shell: bash
        run: |
          VERSION=$(python -c "import ingresosapp; print(ingresosapp.__version__)")
          test "v$VERSION" = "${GITHUB_REF_NAME}" || { echo "La etiqueta ${GITHUB_REF_NAME} no coincide con la versión $VERSION"; exit 1; }
      - name: Tests (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest -q
      - name: Tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -q
      - run: python scripts/compilar.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archivo }}
          path: dist/${{ matrix.archivo }}

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Huellas SHA-256
        run: |
          cd dist
          chmod +x IngresosApp
          sha256sum IngresosApp.exe IngresosApp > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/IngresosApp.exe
            dist/IngresosApp
      - name: Notas de la versión (del CHANGELOG)
        run: python scripts/notas_version.py "${GITHUB_REF_NAME#v}" > notas.md
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: IngresosApp ${{ github.ref_name }}
          body_path: notas.md
          files: |
            dist/IngresosApp.exe
            dist/IngresosApp
            dist/SHA256SUMS.txt
